name: Build iOS IPA (unsigned)

# 手动触发，或改动前端/Rust 源码时自动跑。
# 产物是【未签名 IPA】，需要在本机用全能签 / Sideloadly 重签后才能安装。
#
# 实现说明：项目锁定的 @tauri-apps/cli 是 2.10.1，该版本没有 `ios build --no-sign`
# （2.11+ 才加入）。这里改为 init 之后直接调 xcodebuild 做无签名归档，
# 再按 Payload/ 结构手工封装 IPA，等价于 --no-sign 的效果。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ios-ipa.yml"

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always

jobs:
  ios:
    name: iOS (arm64, unsigned)
    # 必须 Xcode 16+：tauri ios init 生成的工程是 objectVersion 77 格式，
    # macos-14 默认的 Xcode 15 打不开（future Xcode project file format）。
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios-arm64

      - name: Toolchain report
        run: |
          echo "node $(node -v)"
          echo "pnpm $(pnpm -v)"
          echo "rust $(rustc --version)"
          xcodebuild -version
          echo "developer dir: $(xcode-select -p)"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Inspect generated Xcode project
        run: |
          echo "=== gen/apple tree ==="
          ls -la src-tauri/gen/apple || true
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj 2>/dev/null | head -1)
          echo "PROJ=$PROJ"
          if [ -n "$PROJ" ]; then
            echo "=== schemes ==="
            xcodebuild -project "$PROJ" -list -json 2>&1 | head -60
          fi

      - name: Build frontend
        run: pnpm build

      - name: Build (unsigned, Release)
        run: |
          set -uo pipefail
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
          cd src-tauri/gen/apple
          PBX="$(basename "$PROJ")/project.pbxproj"

          echo "=== project.yml ==="
          sed -n '1,80p' project.yml 2>/dev/null || true

          echo "=== pbxproj 里的构建配置名 ==="
          grep -oE 'name = [A-Za-z0-9_]+;' "$PBX" | sed 's/name = //; s/;//' | sort -u

          # 工程里的配置名可能是 release/Release/Debug 等，大小写不一定，
          # 直接指定 "Release" 会被 xcodebuild 忽略并回退到默认配置。
          mapfile -t CONFS < <(grep -oE 'name = [A-Za-z0-9_]+;' "$PBX" | sed 's/name = //; s/;//' | sort -u)
          CONF=""
          for c in "${CONFS[@]}"; do
            if [ "$c" = "Release" ]; then CONF="$c"; break; fi
          done
          if [ -z "$CONF" ]; then
            for c in "${CONFS[@]}"; do
              case "$c" in *elease*) CONF="$c"; break;; esac
            done
          fi
          echo "CHOSEN_CONFIG=${CONF:-<none>}"

          TARGET=$(xcodebuild -project "$(basename "$PROJ")" -list -json | jq -r '.project.targets[0]')
          echo "TARGET=$TARGET"

          if [ -z "$CONF" ]; then
            echo "::warning::工程里没有 release 配置，退回 Debug（大概率仍会因缺 dev server 地址失败）"
            CONF="Debug"
          fi

          set -o pipefail
          xcodebuild build \
            -project "$(basename "$PROJ")" \
            -target "$TARGET" \
            -configuration "$CONF" \
            -sdk iphoneos \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            SYMROOT="$PWD/sym" \
            OBJROOT="$PWD/obj" \
            2>&1 | tee -a "$RUNNER_TEMP/build.log" | tail -60

      - name: Package IPA
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          echo "=== 搜索 .app ==="
          find . -maxdepth 6 -name '*.app' -type d -print 2>/dev/null || true
          APP=$(find sym -maxdepth 3 -name '*.app' -type d -print -quit 2>/dev/null || true)
          if [ -z "$APP" ]; then
            APP=$(find . -maxdepth 6 -name '*.app' -type d -print -quit 2>/dev/null || true)
          fi
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "::error::归档里找不到 .app"
            exit 1
          fi
          rm -rf pkg && mkdir -p pkg/Payload
          cp -R "$APP" pkg/Payload/
          cd pkg
          zip -qry HGhub.ipa Payload
          ls -lh HGhub.ipa
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp HGhub.ipa "$GITHUB_WORKSPACE/out/"
          echo "=== IPA 内部结构 ==="
          unzip -l HGhub.ipa | head -25

      - name: Collect artifacts
        if: always()
        run: |
          set -uo pipefail
          mkdir -p out
          cp "$RUNNER_TEMP/build.log" out/build.log 2>/dev/null || true
          find . -name '*.ipa' -not -path './node_modules/*' -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out || true
          if ls out/*.ipa >/dev/null 2>&1; then
            echo "IPA_OK=true" >> "$GITHUB_ENV"
          else
            echo "IPA_OK=false" >> "$GITHUB_ENV"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-ios-ipa
          path: |
            out/
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when no IPA was produced
        if: always()
        run: |
          if [ "${IPA_OK:-false}" != "true" ]; then
            echo "::error::没有产出 IPA，请看 artifact 里的 build.log"
            exit 1
          fi
