name: Build iOS IPA (unsigned)

# 手动触发，或改动前端/Rust 源码时自动跑。
# 产物是【未签名 IPA】，用全能签 / Sideloadly 重签后才能装到 iPhone。
#
# 关键约束（踩坑记录）：
# 1. 必须用 `tauri ios build`，不能自己调 xcodebuild。
#    因为 tauri 生成的 Xcode 工程里有 "Build Rust Code" 阶段会回连 CLI 进程
#    读配置（temp 下的 <bundle-id>-server-addr）。绕开 CLI 直接 xcodebuild，
#    这个地址文件不存在，xcode-script 一定 panic。
# 2. 必须 Xcode 16+（macos-15）。tauri ios init 生成的工程是 objectVersion 77。
# 3. `--no-sign` 需要 @tauri-apps/cli >= 2.11；本项目已升到 2.12.4
#    以匹配 Rust 侧 tauri 2.12.5。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ios-ipa.yml"

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always

jobs:
  ios:
    name: iOS (arm64, unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios-arm64

      - name: Toolchain report
        run: |
          echo "node $(node -v)"
          echo "pnpm $(pnpm -v)"
          echo "rust $(rustc --version)"
          echo "tauri-cli $(pnpm tauri --version 2>/dev/null || echo unknown)"
          xcodebuild -version

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          pnpm tauri ios build \
            --no-sign \
            --ci \
            --ignore-version-mismatches \
            --target aarch64 \
            --config '{"build":{"beforeBuildCommand":"pnpm build"}}' \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -80

      - name: Collect artifacts
        if: always()
        run: |
          set -uo pipefail
          mkdir -p out
          cp "$RUNNER_TEMP/build.log" out/build.log 2>/dev/null || true
          echo "=== IPA ==="
          find . -name '*.ipa' -not -path './node_modules/*' -print 2>/dev/null || true
          find . -name '*.ipa' -not -path './node_modules/*' -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out || true
          if ls out/*.ipa >/dev/null 2>&1; then
            echo "IPA_OK=true" >> "$GITHUB_ENV"
          else
            echo "IPA_OK=false" >> "$GITHUB_ENV"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-ios-ipa
          path: |
            out/
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when no IPA was produced
        if: always()
        run: |
          if [ "${IPA_OK:-false}" != "true" ]; then
            echo "::error::没有产出 IPA，请看 artifact 里的 build.log"
            exit 1
          fi
